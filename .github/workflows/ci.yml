name: SentinelForge CI/CD Pipeline

on:
  push:
    branches: [ main, master, "feature/*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  unit-and-security-tests:
    name: Unit & Security Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pydantic pyyaml sqlalchemy docker redis

      - name: Run Unit & Security Test Suite (71 Tests)
        run: |
          PYTHONPATH=backend/src python -m pytest backend/tests --ignore=backend/tests/integration -v

  docker-integration-tests:
    name: Native Linux / Docker E2E Integration Tests
    runs-on: ubuntu-latest
    needs: unit-and-security-tests

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pydantic pyyaml sqlalchemy docker redis

      - name: Verify Docker Daemon Environment
        run: |
          docker version
          docker info
          docker images
          docker ps

      - name: Build SentinelForge Target Container
        run: |
          docker build -t sentinelforge-target target/

      - name: Launch Hardened Target Container
        run: |
          docker run -d \
            --name sentinelforge-target \
            --read-only \
            --tmpfs /tmp \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            sentinelforge-target sleep infinity

      - name: Verify Hardened Target Container Status
        run: |
          docker ps
          docker exec sentinelforge-target whoami

      - name: Run Full E2E & Docker Integration Test Suite
        run: |
          PYTHONPATH=backend/src python -m pytest backend/tests/integration -v
